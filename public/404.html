<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Η σελίδα δεν βρέθηκε | Page not found</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #fdf9ff;
        --ink: #3f3355;
        --muted: #6e6489;
        --accent: #7e5fa8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1828;
          --ink: #f2ecff;
          --muted: #a99cc4;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, "Noto Sans", sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(2.4rem, 12vw, 4rem);
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Η σελίδα δεν βρέθηκε. / Page not found.</p>
      <a href="./">Επιδιόρθωση PDF</a>
    </main>
  </body>
</html>
